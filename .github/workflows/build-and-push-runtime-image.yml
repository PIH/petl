name: Build and push PETL runtime image

on:
  push:
    branches: [master]
    paths:
      - "Dockerfile.runtime"
      - "docker-entrypoint.sh"
      - "src/**"
      - "pom.xml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Local Maven Repository
        id: setup_local_maven_repository
        run: |
          ./create-local-maven-repo.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Build jar
        run: mvn -B clean package -DskipTests -Dmaven.source.skip=true -Dmaven.javadoc.skip=true

      - name: Extract version
        id: version
        run: echo "version=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: pihci
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            partnersinhealth/petl:latest
            partnersinhealth/petl:${{ steps.version.outputs.version }}
