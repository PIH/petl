name: Release

on:
  workflow_dispatch:
    inputs:
      republish_existing_tag:
        description: Leave empty for a normal release. Only to re-publish a tag that a failed release already pushed (release:prepare pushed the tag, release:perform failed) - runs release:perform alone, from that tag.
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup Local Maven Repository
      id: setup_local_maven_repository
      run: |
        ./create-local-maven-repo.sh

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 8
        cache: 'maven'
        server-id: sonatype-central
        server-username-env-var: SONATYPE_USERNAME
        server-password-env-var: SONATYPE_PASSWORD

    # Maven 3.9.x until central-publishing-maven-plugin handles Maven 3.10's release bundle
    - name: Set up Maven
      uses: PIH/openmrs-contrib-distro-tools/.github/actions/setup-maven@main

    # Set up git config
    - name: Setup Git Config
      run: |
        git config user.name "Github Action"
        git config user.email "github-action@users.noreply.github.com"

    # With republish_existing_tag, check the tag exists, then recreate the release.properties that
    # release:prepare would have left, so release:perform checks out and publishes that tag (it
    # reads a git tag only from this file).
    - name: Deploy release
      run: |
        goals="release:prepare release:perform"
        if [ -n "$REPUBLISH_TAG" ]; then
          if ! git ls-remote --exit-code --tags origin "refs/tags/$REPUBLISH_TAG" >/dev/null; then
            echo "::error::Tag '$REPUBLISH_TAG' doesn't exist. republish_existing_tag only re-publishes a tag that a failed release already pushed - leave it empty to make a new release."
            exit 1
          fi
          printf 'scm.url=scm:git:%s/%s.git\nscm.tag=%s\ncompletedPhase=end-release\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$REPUBLISH_TAG" > release.properties
          goals="release:perform"
        fi
        mvn -B $goals -Prelease --file pom.xml
      env:
        REPUBLISH_TAG: ${{ inputs.republish_existing_tag }}
        SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.SONATYPE_GPG_PASSPHRASE }}
        MAVEN_GPG_KEY: ${{ secrets.SONATYPE_GPG_PRIVATE_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
